# The playback engine on Windows, alone and fast (a few minutes, no Rust build): castLabs
# Electron, its Widevine VMP signature, and the bridge started the way the app starts it (signed
# out, muted, scratch profile). Runs when the bridge or these checks change on the `windows`
# branch. Nothing here publishes anything.
#
# packaging/windows/probe/ holds diagnostics (how Electron's main process sees its standard
# input on Windows); they only print.
#
# Pins: actions by commit SHA.
name: windows-bridge

on:
  push:
    branches: [windows]
    paths:
      - 'bridge/**'
      - 'packaging/windows/bridge-smoke.mjs'
      - 'packaging/windows/probe/**'
      - 'packaging/windows/vmp/**'
      - '.github/workflows/windows-bridge.yml'

permissions:
  contents: read

concurrency:
  group: windows-bridge-${{ github.ref }}
  cancel-in-progress: true

env:
  # "true": a failing check is reported by the Verdict step and the run stays green (see windows.yml).
  PROBE: "false"

jobs:
  bridge:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: castLabs Electron
        shell: bash
        run: |
          cd bridge && npm ci --no-audit --no-fund
          for try in 1 2 3; do node node_modules/electron/install.js && break; [ $try = 3 ] && exit 1; sleep 10; done

      - name: Widevine VMP signature
        id: vmp
        continue-on-error: ${{ env.PROBE == 'true' }}
        shell: bash
        env:
          EVS_NO_ASK: "1"
          EVS_CONFIG_FILE: ${{ runner.temp }}/evs-config/config.json
        run: |
          dist=bridge/node_modules/electron/dist
          want=$(cut -d' ' -f1 packaging/windows/vmp/electron.exe.sha256)
          have=$(sha256sum "$dist/electron.exe" | cut -d' ' -f1)
          [ "$want" = "$have" ] || { echo "::error::electron.exe is not the one the VMP signature was made for ($have, expected $want)"; exit 1; }
          cp packaging/windows/vmp/electron.exe.sig "$dist/electron.exe.sig"
          mkdir -p "$(dirname "$EVS_CONFIG_FILE")"
          python -m venv "$RUNNER_TEMP/evs"
          "$RUNNER_TEMP/evs/Scripts/python" -m pip install -q castlabs-evs==1.3.3
          "$RUNNER_TEMP/evs/Scripts/python" -m castlabs_evs.vmp verify-pkg "$dist" 2>&1 | tee "$RUNNER_TEMP/vmp.txt"
          grep -q 'Signature is valid: streaming' "$RUNNER_TEMP/vmp.txt"

      - name: How Electron sees its input (diagnostic)
        id: probe
        continue-on-error: true
        shell: bash
        run: node packaging/windows/probe/stdin-probe.mjs bridge/node_modules/electron/dist/electron.exe

      - name: The playback engine answers
        id: bridge
        continue-on-error: ${{ env.PROBE == 'true' }}
        shell: bash
        run: node packaging/windows/bridge-smoke.mjs bridge

      - name: Verdict
        if: always()
        shell: bash
        env:
          OUTCOMES: vmp=${{ steps.vmp.outcome }} probe=${{ steps.probe.outcome }} bridge=${{ steps.bridge.outcome }}
        run: |
          { echo '### Checks'; echo '```'; echo "$OUTCOMES" | tr ' ' '\n' | grep .; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
          if echo "$OUTCOMES" | grep -Eq '(vmp|bridge)=(failure|cancelled|skipped)'; then
            if [ "$PROBE" = true ]; then echo "::warning::some checks did not pass (a probe run reports them and stays green)"; else exit 1; fi
          fi
