# Saves the cargo cache that release.yml's `check` job restores (dependencies already compiled, so
# `cargo test` there builds mostly the workspace). It runs on main because a tag run can read caches
# saved on its own tag or on the default branch, never those of another tag.
#
# Never used by release.yml's `linux` or `macos` jobs: release files come from a clean build.
# The env values, the toolchain step, the paths and the key must stay the same as in `check`.
name: cargo-cache
on:
  push:
    branches: [main]
    paths: [Cargo.lock, .github/workflows/cargo-cache.yml]
  schedule:
    # New stable rustc (new key), and GitHub drops caches not used for 7 days.
    - cron: '17 4 * * 1,4'
  workflow_dispatch:
    inputs:
      # TEMPORARY (branch animated-art only, reverted before merging): a Linux build and test check.
      test: { type: boolean, default: false, description: 'Build and run cargo test, save no cache' }

permissions:
  contents: read

concurrency:
  group: cargo-cache
  cancel-in-progress: true

jobs:
  warm:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends libasound2-dev libxkbcommon-dev pkg-config ${{ inputs.test && 'ffmpeg' || '' }}
      - id: rust
        run: |
          rustup toolchain install stable --profile minimal && rustup default stable && rustc --version
          echo "key=cargo-check-$RUNNER_OS-$(rustc -vV | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # Exact key only: a hit just keeps the cache alive. A miss builds from clean, so old
      # dependency versions do not pile up in target/.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust.outputs.key }}-${{ hashFiles('Cargo.lock') }}
      - if: inputs.test
        run: cargo build --workspace --locked && cargo test --workspace --locked
      - if: steps.cache.outputs.cache-hit != 'true' && !inputs.test
        run: cargo test --workspace --locked --no-run
      - if: steps.cache.outputs.cache-hit != 'true' && !inputs.test
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust.outputs.key }}-${{ hashFiles('Cargo.lock') }}
