[package]
name = "uzumaki"
version.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"
description = "Uzumaki: a Rust, GPU-rendered frontend for Apple Music (Rune UI)"

[dependencies]
# Rune is pre-release: pin a rev of its dev branch.
rune = { git = "https://github.com/anomalyco/rune", rev = "f3d04f3f2069d177d04c963b0ba9f6b2065e46eb", features = ["native-file-dialog"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# JPEG XL pictures (picture.rs): pure Rust, MIT OR Apache-2.0, no C library, no colour-management
# crate (default features off also drops rayon).
jxl-oxide = { version = "0.12", default-features = false }
uzumaki-fx = { path = "../fx" }
# The `uzu` control protocol and socket (the app answers, `uzu` asks).
uzumaki-ctl = { path = "../ctl" }
# AirPlay: finds speakers (mDNS), PCM socket for the bridge, cliairplay for the chosen speaker.
uzumaki-airplay = { path = "../airplay" }
# Chromecast spike (only with UZUMAKI_CAST_SPIKE=1): mDNS, CASTV2, the HTTP stream.
uzumaki-cast = { path = "../cast" }
roxmltree = "0.20"
# Local files: in-process playback and tags. rodio drives cpal (ALSA → PipeWire via
# pipewire-alsa) and decodes with symphonia; lofty reads tags and embedded covers.
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-flac", "symphonia-mp3", "symphonia-aac", "symphonia-isomp4", "symphonia-alac", "symphonia-vorbis", "symphonia-ogg", "symphonia-wav", "symphonia-pcm"] }
lofty = "0.25"
# Script hooks (hooks.rs): geteuid, killpg. On macOS also stderr into ~/Library/Logs/Uzumaki (logfile.rs): dup2.
# Local time (update.rs): localtime_r, on Windows localtime_s.
libc = "0.2"

# Linux and macOS. Same zbus 5 that Rune's accessibility stack already builds (no extra copy);
# blocking API for MPRIS, notifications and "Show in Folder". (macOS compiles `mpris.rs` for its
# shared types and tests; Windows has no session bus and leaves it out.)
[target.'cfg(unix)'.dependencies]
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

# Windows glue, on the windows-sys and windows crates Rune already builds (new features only).
# - `win.rs`: the console and log output, the app id, the window's icon and title bar, Explorer's
#   "show in folder", the job that ends Electron with the app, registry calls.
# - `login_win.rs`: start at login (the Run key). `discord/pipe.rs`: Discord's named pipe.
# - `smtc.rs`: media keys and the media overlay (WinRT `Windows.Media`, a hidden window).
# - `notify/windows.rs`: toast notifications (WinRT `Windows.UI.Notifications`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Registry", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "Media", "Storage_Streams", "UI_Notifications", "Win32_Foundation", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging"] }

# macOS only, on the objc2 0.6 stack Rune already builds (minimal features: no extra frameworks).
# Media keys and Control Center (nowplaying.rs): MPRemoteCommandCenter / MPNowPlayingInfoCenter.
# The menu bar icon (tray_mac.rs): NSStatusItem and NSMenu, and its volume slider item (NSSlider, NSTimer).
# Share's system services (share_mac.rs): NSSharingService, icons drawn through NSBitmapImageRep.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString", "NSDictionary", "NSValue", "NSArray", "NSData", "NSProcessInfo", "NSGeometry", "NSObject", "NSURL", "NSEnumerator", "NSError", "NSUserDefaults", "NSTimer", "NSRunLoop", "NSObjCRuntime", "NSDate"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSImage", "NSApplication", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSCell", "NSView", "NSResponder", "NSMenu", "NSMenuItem", "NSSharingService", "NSBitmapImageRep", "NSImageRep", "NSGraphicsContext", "NSGraphics", "NSWindow", "NSAppearance", "NSSlider", "NSTextField", "NSImageView", "NSEvent", "NSFont", "NSColor", "NSAccessibilityProtocols", "NSParagraphStyle"] }
block2 = "0.6"
dispatch2 = "0.3"

# The icon, version details and manifest of the Windows program (`build.rs`). Build-time only, and
# only when building on Windows: Linux and macOS never compile it.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

# macOS: the menu bar's AppKit tidy on a real NSApplication menu, on the main thread, with no
# window and no event loop (the same pattern as Rune's own menu tests). A no-op elsewhere.
[[test]]
name = "menu_bar_macos"
harness = false
